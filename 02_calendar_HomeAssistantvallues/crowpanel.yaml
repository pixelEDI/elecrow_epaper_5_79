wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

http_request:
  timeout: 10s
  verify_ssl: true

switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

binary_sensor:
  - platform: gpio
    id: rotary_up
    pin:
      number: 6
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lvgl.page.next:

  - platform: gpio
    id: rotary_down
    pin:
      number: 4
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lvgl.page.previous:

  - platform: gpio
    id: rotary_press
    pin:
      number: 5
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute: request_ha_update

display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    invert_colors: true
    full_update_every: 9999
    auto_clear_enabled: false
    update_interval: never

# Shared entry point for embedded test data and later an HTTP response body.
json:

script:
  - id: request_calendar
    then:
      - http_request.get:
          url: !secret calendar_url
          request_headers:
            x-api-key: !secret calendar_api_key
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - script.execute:
                        id: calendar_apply_json
                        payload: !lambda return body;

  - id: request_ha_update
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.temp_1_temperature,sensor.temp_1_humidity,sensor.temp_2_temperature,sensor.temp_2_humidity,sensor.temp_3_temperature,sensor.temp_3_humidity,sensor.temp_4_temperature,sensor.temp_4_humidity,sensor.temp_5_temperature,sensor.temp_5_humidity,sensor.temp_6_temperature,sensor.temp_6_humidity
      - script.execute: request_calendar

  - id: room_apply_humidity
    parameters:
      room: int
      humidity: float
    then:
      - lambda: |-
          lv_obj_t *labels[] = {id(room_1_humidity), id(room_2_humidity), id(room_3_humidity), id(room_4_humidity), id(room_5_humidity), id(room_6_humidity)};
          if (room < 1 || room > 6) return;
          auto *label = labels[room - 1];
          const bool valid = std::isfinite(humidity) && humidity >= 0.0f && humidity <= 100.0f;
          const bool high = valid && humidity > 60.0f;
          if (valid) lv_label_set_text(label, str_sprintf("%.1f %%", humidity).c_str());
          else lv_label_set_text(label, "-- %");
          lv_obj_set_style_bg_color(label, lv_color_hex(high ? 0x000000 : 0xFFFFFF), LV_PART_MAIN);
          lv_obj_set_style_bg_opa(label, LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_set_style_text_color(label, lv_color_hex(high ? 0xFFFFFF : 0x000000), LV_PART_MAIN);

  - id: calendar_apply_json
    parameters:
      payload: string
    then:
      - lambda: |-
          json::parse_json(payload, [](JsonObject root) -> bool {
            ArduinoJson::DynamicJsonDocument normalized(8192);
            JsonArray events = normalized["events"].to<JsonArray>();
            if (root["events"].is<JsonArray>()) {
              for (JsonObject source : root["events"].as<JsonArray>()) {
                JsonObject event = events.createNestedObject();
                event["date"] = source["date"] | "";
                event["time"] = source["time"] | "";
                event["title"] = source["title"] | "";
              }
            } else if (root["termine"].is<JsonArray>()) {
              auto format_date = [](const std::string &iso) {
                const int year = std::stoi(iso.substr(0, 4));
                const int month = std::stoi(iso.substr(5, 2));
                const int day = std::stoi(iso.substr(8, 2));
                static const int month_offsets[] = {0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4};
                int adjusted_year = year - (month < 3 ? 1 : 0);
                const int weekday = (adjusted_year + adjusted_year / 4 - adjusted_year / 100 + adjusted_year / 400 + month_offsets[month - 1] + day) % 7;
                static const char *weekday_names[] = {"So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
                return std::string(weekday_names[weekday]) + ", " + iso.substr(8, 2) + "." + iso.substr(5, 2) + ".";
              };
              for (JsonObject source : root["termine"].as<JsonArray>()) {
                const std::string start = source["start"] | "";
                if (start.size() < 16) continue;
                JsonObject event = events.createNestedObject();
                event["date"] = format_date(start);
                event["time"] = (source["ganztaegig"] | false) ? "Ganztägig" : start.substr(11, 5);
                event["title"] = source["titel"] | "";
              }
            } else return false;
            // Validate before replacing the currently displayed data.
            for (JsonObject event : events) {
              if (!event["date"].is<const char *>() ||
                  !event["time"].is<const char *>() ||
                  !event["title"].is<const char *>()) return false;
            }
            lv_obj_t *meta[] = {id(event_0_meta), id(event_1_meta), id(event_2_meta), id(event_3_meta), id(event_4_meta)};
            lv_obj_t *titles[] = {id(event_0_title), id(event_1_title), id(event_2_title), id(event_3_title), id(event_4_title)};
            lv_obj_t *blocks[] = {id(event_0_block), id(event_1_block), id(event_2_block), id(event_3_block), id(event_4_block)};
            lv_obj_t *times[] = {id(event_0_time), id(event_1_time), id(event_2_time), id(event_3_time), id(event_4_time)};
            // U+00AD marks allowed syllable boundaries; only render a hyphen at a wrap.
            auto wrap_title = [](const std::string &text, lv_obj_t *label) {
              const auto *font = lv_obj_get_style_text_font(label, LV_PART_MAIN);
              const auto spacing = lv_obj_get_style_text_letter_space(label, LV_PART_MAIN);
              const int width = 240;
              auto fits = [&](const std::string &value) {
                lv_point_t size;
                lv_text_get_size(&size, value.c_str(), font, spacing, 0, LV_COORD_MAX, LV_TEXT_FLAG_NONE);
                return size.x <= width;
              };
              std::string result, line;
              auto newline = [&]() {
                if (!result.empty()) result += "\n";
                result += line;
                line.clear();
              };
              size_t start = 0;
              while (start < text.size()) {
                size_t end = text.find_first_of(" \n", start);
                if (end == std::string::npos) end = text.size();
                std::string word;
                std::vector<size_t> breaks;
                for (size_t j = start; j < end; j++) {
                  if (text.compare(j, 2, "\xC2\xAD") == 0) {
                    breaks.push_back(word.size());
                    j++;
                  } else word += text[j];
                }
                while (!word.empty()) {
                  std::string prefix = line.empty() ? "" : line + " ";
                  if (fits(prefix + word)) { line = prefix + word; break; }
                  size_t split = 0;
                  for (size_t pos : breaks)
                    if (pos > 0 && pos < word.size() && fits(prefix + word.substr(0, pos) + "-")) split = pos;
                  if (split != 0) {
                    line = prefix + word.substr(0, split) + "-";
                    newline();
                    word.erase(0, split);
                    std::vector<size_t> remaining;
                    for (size_t pos : breaks) if (pos > split) remaining.push_back(pos - split);
                    breaks = remaining;
                  } else if (!line.empty()) newline();
                  else { line = word; break; } // LVGL wraps unmarked oversized words.
                }
                if (end < text.size() && text[end] == '\n') newline();
                start = end + 1;
              }
              if (!line.empty()) newline();
              return result;
            };
            // Group by date, preserving the supplied order of days and appointments.
            std::vector<JsonObject> ordered;
            std::vector<std::string> days;
            for (JsonObject event : events) {
              std::string day = event["date"].as<const char *>();
              bool seen = false;
              for (const auto &existing : days) if (existing == day) seen = true;
              if (!seen) days.push_back(day);
            }
            for (const auto &day : days)
              for (JsonObject event : events)
                if (day == event["date"].as<const char *>()) ordered.push_back(event);
            std::string previous_day;
            for (size_t i = 0; i < 5; i++) {
              if (i < ordered.size() || (i == 0 && events.size() == 0))
                lv_obj_clear_flag(blocks[i], LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(blocks[i], LV_OBJ_FLAG_HIDDEN);
              std::string heading;
              std::string title;
              std::string time;
              if (i < ordered.size()) {
                heading = ordered[i]["date"].as<const char *>();
                time = ordered[i]["time"].as<const char *>();
                title = ordered[i]["title"].as<const char *>();
              } else if (i == 0) {
                title = "Keine Termine";
              }
              if (heading.empty() || heading == previous_day)
                lv_obj_add_flag(meta[i], LV_OBJ_FLAG_HIDDEN);
              else lv_obj_clear_flag(meta[i], LV_OBJ_FLAG_HIDDEN);
              previous_day = heading;
              lv_label_set_text(meta[i], heading.c_str());
              lv_label_set_text(times[i], time.c_str());
              if (time.empty()) lv_obj_add_flag(times[i], LV_OBJ_FLAG_HIDDEN);
              else lv_obj_clear_flag(times[i], LV_OBJ_FLAG_HIDDEN);
              title = wrap_title(title, titles[i]);
              lv_label_set_text(titles[i], title.c_str());
            }
            return true;
          });

